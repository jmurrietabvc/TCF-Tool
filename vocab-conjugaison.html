  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --bg: #090d16;
      --card: #111726;
      --border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --cyan: #38bdf8;
      --gold: #f59e0b;
      --green: #10b981;
      --red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
    }

    /* Minimal Topbar */
    .topbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 15px;
      font-weight: 800;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
    }
    .brand span { color: var(--cyan); }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12.5px;
      font-weight: 600;
      transition: color 0.2s;
    }
    .nav-link:hover { color: #fff; }

    /* Clean Categories Filter (No side scroll) */
    .filter-wrap {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .filter-btn {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-btn:hover {
      color: #fff;
      border-color: #334155;
    }
    .filter-btn.active {
      background: rgba(56, 189, 248, 0.15);
      border-color: var(--cyan);
      color: var(--cyan);
    }
    .filter-btn.err-btn {
      color: #fca5a5;
    }
    .filter-btn.err-btn.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--red);
      color: var(--red);
    }

    /* Minimalist Flashcard Container */
    .flashcard {
      width: 100%;
      max-width: 680px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .badge-cat {
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Prominent Target */
    .target-word {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 10px;
      letter-spacing: -0.5px;
    }
    .target-sub {
      font-size: 14px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 28px;
    }

    /* Input & Button */
    .input-box {
      display: flex;
      gap: 8px;
      max-width: 440px;
      margin: 0 auto 16px;
    }
    .user-input {
      flex: 1;
      background: #090d16;
      border: 2px solid var(--border);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      outline: none;
      text-align: center;
      transition: border-color 0.2s;
    }
    .user-input:focus {
      border-color: var(--cyan);
    }
    .user-input.correct {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
    }
    .user-input.wrong {
      border-color: var(--red);
      background: rgba(239, 68, 68, 0.1);
      color: #f87171;
    }

    .btn-check {
      background: var(--cyan);
      color: #090d16;
      border: none;
      border-radius: 10px;
      padding: 0 20px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-check:hover { opacity: 0.9; }

    /* Minimal Accents */
    .accents {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .acc-key {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 6px;
      cursor: pointer;
    }
    .acc-key:hover {
      color: #fff;
      border-color: var(--cyan);
    }

    /* Clean Inline Feedback */
    .feedback {
      display: none;
      margin-top: 20px;
      padding: 16px;
      border-radius: 12px;
      text-align: left;
      font-size: 13.5px;
      line-height: 1.5;
      animation: fadeIn 0.2s ease;
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: rgba(16, 185, 129, 0.08);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }
    .feedback.wrong {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
    .fb-status {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .fb-detail {
      color: #e2e8f0;
      margin-bottom: 8px;
    }
    .fb-rule {
      color: var(--text-muted);
      font-size: 12.5px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 8px;
    }

    .next-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-next {
      background: #fff;
      color: #090d16;
      border: none;
      padding: 8px 18px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
    }
    .btn-remove-err {
      background: transparent;
      border: 1px solid var(--green);
      color: var(--green);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Score Bar */
    .score-row {
      width: 100%;
      max-width: 680px;
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .score-row strong { color: #fff; }

    /* Empty state */
    .empty-box {
      display: none;
      padding: 40px 10px;
      text-align: center;
    }
    .empty-box h3 { font-size: 18px; margin-bottom: 6px; }
    .empty-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>

      <div class="fb-rule" id="fbRule"></div>
      <div class="next-row">

    const STORAGE_KEY = 'tcf_ee_flash_v3';

    let state = {
      category: 'all',
      currentIndex: 0,
      score: 0,
      streak: 0,
      answered: false,
      errorIds: new Set(),
      activeDeck: []
    };

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function loadErrors() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state.errorIds = new Set(JSON.parse(raw));
      } catch (e) {
        state.errorIds = new Set();
      }
      document.getElementById('errCountBadge').textContent = state.errorIds.size;
    }

    function saveErrors() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(state.errorIds)));
      } catch (e) {}
      document.getElementById('errCountBadge').textContent = state.errorIds.size;
    }

    function setCategory(cat) {
      state.category = cat;
      state.currentIndex = 0;

      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      const activeBtn = Array.from(document.querySelectorAll('.filter-btn')).find(b => b.getAttribute('onclick').includes("'" + cat + "'"));
      if (activeBtn) activeBtn.classList.add('active');

      rebuildDeck();
      renderCard();
    }

    function rebuildDeck() {
      let raw;
      if (state.category === 'errors') {
        raw = ITEMS.filter(it => state.errorIds.has(it.id));
      } else if (state.category === 'all') {
        raw = ITEMS;
      } else {
        raw = ITEMS.filter(it => it.cat === state.category);
      }
      state.activeDeck = shuffle(raw);
    }

    function renderCard() {
      const deck = state.activeDeck;
      const content = document.getElementById('activeContent');
      const empty = document.getElementById('emptyBox');
      const cardTop = document.getElementById('cardTop');
      const fb = document.getElementById('feedbackBox');

      fb.classList.remove('show', 'correct', 'wrong');
      document.getElementById('btnRemoveErr').style.display = 'none';

      if (!deck || deck.length === 0) {
        content.style.display = 'none';
        cardTop.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      content.style.display = 'block';
      cardTop.style.display = 'flex';
      empty.style.display = 'none';

      if (state.currentIndex >= deck.length) {
        state.currentIndex = 0;
      }

      const item = deck[state.currentIndex];
      state.answered = false;

      document.getElementById('badgeCat').textContent = item.badge;
      document.getElementById('counterProgress').textContent = (state.currentIndex + 1) + ' / ' + deck.length;
      document.getElementById('targetDisplay').textContent = item.target;
      document.getElementById('targetSub').textContent = item.sub;

      const inp = document.getElementById('answerInput');
      inp.value = '';
      inp.className = 'user-input';
      inp.disabled = false;
      inp.focus();
    }

    function onKey(e) {
      if (e.key === 'Enter') {
        if (state.answered) nextCard();
        else checkAnswer();
      }
    }

    function diagnose(userAns, target) {
      const u = userAns.trim().toLowerCase();
      const t = target.trim().toLowerCase();

      const uNoAcc = u.normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");
      const tNoAcc = t.normalize("NFD").replace(/[\\u0300-\\u036f]/g, "");

      if (uNoAcc === tNoAcc && u !== t) {
        return "⚠️ <strong>Falta de acentos:</strong> Escribiste <code>" + userAns + "</code> sin la tilde correcta. Forma exacta: <code>" + target + "</code>.";
      }
      if (t.endsWith('e') && !u.endsWith('e') && t.slice(0, -1) === u) {
        return "⚠️ <strong>Falta de GÉNERO:</strong> Olvidaste la <strong>'-e'</strong> final de femenino.";
      }
      if (t.endsWith('s') && !u.endsWith('s') && t.slice(0, -1) === u) {
        return "⚠️ <strong>Falta de PLURAL:</strong> Olvidaste la <strong>'-s'</strong> final de plural.";
      }
      if ((t === 'un' || t === 'le') && (u === 'une' || u === 'la')) {
        return "⚠️ <strong>Error de Género:</strong> Es una palabra <strong>MASCULINA</strong> en francés.";
      }
      if ((t === 'une' || t === 'la') && (u === 'un' || u === 'le')) {
        return "⚠️ <strong>Error de Género:</strong> Es una palabra <strong>FEMENINA</strong> en francés.";
      }
      return "⚠️ <strong>Forma no válida:</strong> Compara lo que escribiste con la respuesta oficial.";
    }

    function checkAnswer() {
      if (state.answered) return;
      const inp = document.getElementById('answerInput');
      const val = inp.value.trim();
      if (!val) return;

      state.answered = true;
      const deck = state.activeDeck;
      const item = deck[state.currentIndex];

      const norm = val.toLowerCase();
      const isOk = item.ans.some(a => a.toLowerCase() === norm);

      const fb = document.getElementById('feedbackBox');
      const fbStatus = document.getElementById('fbStatus');
      const fbDetail = document.getElementById('fbDetail');
      const fbRule = document.getElementById('fbRule');
      const btnRemove = document.getElementById('btnRemoveErr');

      fb.classList.remove('correct', 'wrong');

      if (isOk) {
        state.score++;
        state.streak++;
        fb.classList.add('correct', 'show');
        inp.classList.add('correct');
        inp.disabled = true;

        fbStatus.innerHTML = "✅ ¡Correcto!";
        fbDetail.innerHTML = "Escribiste exactamente: <strong style='color:#34d399;'>" + val + "</strong>";
        fbRule.innerHTML = item.rule;

        if (state.category === 'errors' || state.errorIds.has(item.id)) {
          btnRemove.style.display = 'inline-block';
        }
      } else {
        state.streak = 0;
        state.errorIds.add(item.id);
        saveErrors();

        fb.classList.add('wrong', 'show');
        inp.classList.add('wrong');
        inp.disabled = true;

        fbStatus.innerHTML = "❌ ¡Error guardado en tu Banco de Errores!";
        fbDetail.innerHTML = "Respuesta oficial: <strong style='color:#34d399;'>" + item.ans[0] + "</strong><br>" + diagnose(val, item.ans[0]);
        fbRule.innerHTML = item.rule;
      }

      document.getElementById('scoreVal').textContent = state.score;
      document.getElementById('streakVal').textContent = state.streak + ' 🔥';
    }

    function nextCard() {
      state.currentIndex++;
      renderCard();
    }

    function resolveCurrentError() {
      const deck = state.activeDeck;
      const item = deck[state.currentIndex];
      if (state.errorIds.has(item.id)) {
        state.errorIds.delete(item.id);
        saveErrors();
        rebuildDeck();
        renderCard();
      }
    }

    function addAccent(ch) {
      const inp = document.getElementById('answerInput');
      const start = inp.selectionStart || inp.value.length;
      const end = inp.selectionEnd || inp.value.length;
      inp.value = inp.value.substring(0, start) + ch + inp.value.substring(end);
      inp.focus();
      inp.selectionStart = inp.selectionEnd = start + 1;
    }

    window.onload = () => {
      loadErrors();
      setCategory('all');
    };
  </script>
