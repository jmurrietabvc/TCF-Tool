<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Flash Drill TCF — Entraîneur Minimaliste 10+</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a10;
      --card: #13151f;
      --card-inner: #191c2b;
      --border: #232738;
      --border-focus: #38bdf8;
      --text: #f8fafc;
      --text-muted: #8b92a5;
      --cyan: #38bdf8;
      --gold: #fbbf24;
      --green: #10b981;
      --red: #f43f5e;
      --shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.6);
    }

    *, *::before, *::after {
      box-sizing: border-box;
      max-width: 100%;
    }

    html, body {
      overflow-x: hidden !important;
      width: 100%;
      max-width: 100vw;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px 14px 40px;
    }

    /* Minimal Header */
    .topbar {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .brand {
      font-size: 15px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      letter-spacing: -0.3px;
    }
    .brand span { color: var(--cyan); }
    .nav-actions {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .nav-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.15s;
    }
    .nav-link:hover { color: #ffffff; }

    /* Controls: Zero side-scroll guaranteed */
    .controls-deck {
      width: 100%;
      max-width: 520px;
      display: flex;
      gap: 8px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .dropdown-select {
      flex: 1 1 220px;
      min-width: 0;
      background: var(--card);
      border: 1.5px solid var(--border);
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      outline: none;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .dropdown-select:focus {
      border-color: var(--border-focus);
    }

    .btn-err-toggle {
      flex: 0 0 auto;
      background: rgba(244, 63, 94, 0.08);
      border: 1.5px solid rgba(244, 63, 94, 0.3);
      color: #fb7185;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-err-toggle:hover {
      background: rgba(244, 63, 94, 0.16);
    }
    .btn-err-toggle.active {
      background: var(--red);
      color: #ffffff;
      border-color: var(--red);
    }

    /* The Flashcard */
    .flashcard {
      width: 100%;
      max-width: 520px;
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: var(--shadow);
      position: relative;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--text-muted);
    }
    .badge-cat {
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: 800;
    }

    /* Target Word & Subtext */
    .target-word {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(24px, 5.5vw, 32px);
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.5px;
      word-break: break-word;
    }
    .target-sub {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--gold);
      margin-bottom: 24px;
      line-height: 1.4;
    }

    /* Input & Submit */
    .input-box {
      display: flex;
      gap: 8px;
      width: 100%;
      max-width: 420px;
      margin: 0 auto 14px;
    }
    .user-input {
      flex: 1;
      min-width: 0;
      background: var(--card-inner);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 700;
      color: #ffffff;
      outline: none;
      text-align: center;
      transition: all 0.2s;
    }
    .user-input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .user-input.correct {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.12);
      color: #34d399;
    }
    .user-input.wrong {
      border-color: var(--red);
      background: rgba(244, 63, 94, 0.12);
      color: #fb7185;
    }

    .btn-check {
      background: var(--cyan);
      color: #090a10;
      border: none;
      border-radius: 12px;
      padding: 0 18px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .btn-check:hover { opacity: 0.9; transform: translateY(-1px); }

    /* Minimal Accents Strip */
    .accents {
      display: flex;
      justify-content: center;
      gap: 5px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      max-width: 100%;
    }
    .acc-key {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 12.5px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .acc-key:hover {
      color: #ffffff;
      border-color: var(--cyan);
      background: rgba(56, 189, 248, 0.1);
    }

    /* Feedback Drawer */
    .feedback {
      display: none;
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 14px;
      text-align: left;
      font-size: 13px;
      line-height: 1.5;
      animation: popIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .feedback.show { display: block; }
    .feedback.correct {
      background: rgba(16, 185, 129, 0.08);
      border: 1.5px solid rgba(16, 185, 129, 0.3);
    }
    .feedback.wrong {
      background: rgba(244, 63, 94, 0.08);
      border: 1.5px solid rgba(244, 63, 94, 0.3);
    }
    .fb-status {
      font-size: 14.5px;
      font-weight: 800;
      margin-bottom: 4px;
    }
    .fb-detail {
      color: #e2e8f0;
      margin-bottom: 6px;
      font-size: 13px;
    }
    .fb-rule {
      color: var(--text-muted);
      font-size: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 8px;
      margin-top: 6px;
    }

    .next-row {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }
    .btn-next {
      background: #ffffff;
      color: #090a10;
      border: none;
      padding: 8px 16px;
      border-radius: 10px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-next:hover { opacity: 0.9; }

    .btn-remove-err {
      background: transparent;
      border: 1.5px solid var(--green);
      color: var(--green);
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-remove-err:hover {
      background: rgba(16, 185, 129, 0.15);
    }

    /* Score Bar */
    .score-row {
      width: 100%;
      max-width: 520px;
      display: flex;
      justify-content: space-between;
      margin-top: 16px;
      font-size: 12.5px;
      color: var(--text-muted);
      padding: 0 4px;
    }
    .score-row strong { color: #ffffff; }

    /* Empty state */
    .empty-box {
      display: none;
      padding: 30px 10px;
      text-align: center;
    }
    .empty-box h3 { font-size: 18px; margin-bottom: 6px; color: #ffffff; }
    .empty-box p { color: var(--text-muted); font-size: 13px; margin-bottom: 16px; }

    @keyframes popIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- Minimal Top Header -->
  <header class="topbar">
    <a href="index.html" class="brand">⚡ Flash <span>TCF 10+</span></a>
    <div class="nav-actions">
      <a href="fiches-10plus.html" class="nav-link">📑 Fiches</a>
      <a href="squelette-atelier.html" class="nav-link">🦴 Squelette</a>
      <a href="index.html" class="nav-link">🏠 Hub</a>
    </div>
  </header>

  <!-- Clean Controls (Single Dropdown + Error Toggle, zero side-scrolling) -->
  <div class="controls-deck">
    <select id="categorySelect" class="dropdown-select" onchange="onCategoryChange(this.value)">
      <option value="all">🌟 Mix Total (132 items)</option>
      <option value="genre">♂️♀️ Género: Falsos amigos (un / une)</option>
      <option value="accents">🎯 Acentos & Cedillas (é, è, ê, à, ç, û...)</option>
      <option value="conj">🔀 Conjugación Clave: Subjuntivo, Condicional & Acuerdos (32)</option>
      <option value="contractions">🔗 Contracciones en Contexto: au, du, aux, des...</option>
      <option value="demonstratif">👉 Demostrativos: Ce / Cet / Cette / Ces</option>
      <option value="accords">🎭 Frases completas: un/une + palabra + descripción</option>
      <option value="antirepetition">🎯 Vocabulario B2 (12-13): Anti-repetición</option>
    </select>
    <button class="btn-err-toggle" id="btnErrToggle" onclick="toggleErrorMode()">
      🚨 Errores (<span id="errCountBadge">0</span>)
    </button>
  </div>

  <!-- Minimalist Flashcard Container -->
  <div class="flashcard">
    <div class="card-top" id="cardTop">
      <span class="badge-cat" id="badgeCat">GENRE</span>
      <span id="counterProgress">1 / 132</span>
    </div>

    <!-- Active Card Content -->
    <div id="activeContent">
      <div class="target-word" id="targetDisplay">PROBLÈME</div>
      <div class="target-sub" id="targetSub">¿Masculino o femenino? (un / une)</div>

      <!-- Input Box -->
      <div class="input-box">
        <input type="text" id="answerInput" class="user-input" placeholder="Tu respuesta..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" onkeydown="onKey(event)">
        <button class="btn-check" onclick="checkAnswer()">Valider</button>
      </div>

      <!-- Minimal Quick Accents -->
      <div class="accents">
        <button class="acc-key" onclick="addAccent('é')">é</button>
        <button class="acc-key" onclick="addAccent('è')">è</button>
        <button class="acc-key" onclick="addAccent('ê')">ê</button>
        <button class="acc-key" onclick="addAccent('à')">à</button>
        <button class="acc-key" onclick="addAccent('ç')">ç</button>
        <button class="acc-key" onclick="addAccent('ù')">ù</button>
        <button class="acc-key" onclick="addAccent('î')">î</button>
        <button class="acc-key" onclick="addAccent('ï')">ï</button>
        <button class="acc-key" onclick="addAccent('ô')">ô</button>
        <button class="acc-key" onclick="addAccent('û')">û</button>
      </div>
    </div>

    <!-- Feedback -->
    <div class="feedback" id="feedbackBox">
      <div class="fb-status" id="fbStatus"></div>
      <div class="fb-detail" id="fbDetail"></div>
      <div class="fb-rule" id="fbRule"></div>
      <div class="next-row">
        <button class="btn-remove-err" id="btnRemoveErr" style="display:none;" onclick="resolveCurrentError()">✅ Marcar asimilada</button>
        <button class="btn-next" onclick="nextCard()">Suivant ➔ (Entrée)</button>
      </div>
    </div>

    <!-- Empty State -->
    <div class="empty-box" id="emptyBox">
      <h3>🎉 ¡Banco de errores vacío!</h3>
      <p>Todas tus dudas registradas han sido dominadas. ¡Excelente trabajo!</p>
      <button class="btn-check" onclick="onCategoryChange('all')" style="padding:10px 18px;">🌟 Volver al Mix General</button>
    </div>
  </div>

    <div>Aciertos: <strong id="scoreVal">0</strong></div>
    <div>Racha: <strong id="streakVal">0 🔥</strong></div>

      { id:"ct15", cat:"contractions", badge:"Contraction", target:"PROFITER  [ ... ]  séjour", sub:"¿Qué contracción corresponde? (du / de la / des / au...)", ans:["du","du séjour"], rule:"💡 <strong>profiter DE :</strong> 'Séjour' es masculino ➔ <em>profiter <strong>du</strong> séjour</em>." },
      { id:"ct16", cat:"contractions", badge:"Contraction", target:"LA PLUPART  [ ... ]  citoyens", sub:"¿Qué contracción corresponde? (du / de la / des / au...)", ans:["des","des citoyens"], rule:"💡 <strong>la plupart DE :</strong> Plural obligatorio con contracción ➔ <em>la plupart <strong>des</strong> citoyens</em> (nunca 'de les')." },
      { id:"ct17", cat:"contractions", badge:"Contraction", target:"AU COURS  [ ... ]  dernières années", sub:"¿Qué contracción corresponde? (du / de la / des / au...)", ans:["des","des dernières années"], rule:"💡 <strong>au cours DE :</strong> Plural ➔ <em>au cours <strong>des</strong> dernières années</em>." },
      { id:"ct18", cat:"contractions", badge:"Contraction", target:"AU NIVEAU  [ ... ]  pays", sub:"¿Qué contracción corresponde? (du / de la / des / au...)", ans:["du","du pays"], rule:"💡 <strong>au niveau DE :</strong> 'Pays' es masculino singular ➔ <em>au niveau <strong>du</strong> pays</em>." },
      { id:"ct19", cat:"contractions", badge:"Contraction", target:"S'OPPOSER  [ ... ]  projet", sub:"¿Qué contracción corresponde? (au / à la / aux / du...)", ans:["au","au projet"], rule:"💡 <strong>s'opposer À :</strong> 'Projet' es masculino ➔ <em>s'opposer <strong>au</strong> projet</em>." },
      { id:"ct20", cat:"contractions", badge:"Contraction", target:"SE RENDRE  [ ... ]  travail", sub:"¿Qué contracción corresponde? (au / à la / aux / du...)", ans:["au","au travail"], rule:"💡 <strong>se rendre À :</strong> 'Travail' es masculino ➔ <em>se rendre <strong>au</strong> travail</em>." },

      // 7. VOCABULAIRE NATUREL B2 (12-13) : ANTI-RÉPÉTITION
      { id:"ar1", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"FAIRE DES PROBLÈMES", sub:"Verbo natural B2 (en vez de 'faire des problèmes') :", ans:["engendrer","créer","poser","créer des problèmes","poser problème"], rule:"💡 <strong>créer des problèmes / poser problème / engendrer :</strong> Mucho más limpio y natural en el examen." },
      { id:"ar2", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"FAIRE DU MAL À", sub:"Verbo natural B2 (nuire ...) :", ans:["nuire","nuire à"], rule:"💡 <strong>nuire à :</strong> Expresión estándar B2 para ensayos: <em>nuire au bien-être / à la santé</em>." },
      { id:"ar3", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"LE TEXTE DIT QUE", sub:"Verbo natural B2 (3ª sing. présent) :", ans:["souligne","indique","précise","évoque"], rule:"💡 <strong>souligne / indique / précise :</strong> Para resumir documentos en la Tâche 3 sin repetir 'dit'." },
      { id:"ar4", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"SE FAIRE DES AMIS", sub:"Expresión natural B2 (... des liens) :", ans:["tisser","nouer","tisser des liens","nouer des liens"], rule:"💡 <strong>tisser / nouer des liens :</strong> Frase hecha indispensable en cartas y relatos de convivencia." },
      { id:"ar5", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"DÉCONNECTER / SE REPOSER", sub:"Verbo reflexivo natural B2 (se ...) :", ans:["se ressourcer","ressourcer","se détendre","détendre"], rule:"💡 <strong>se ressourcer / se détendre :</strong> Perfecto para narrar viajes o fines de semana en la Tâche 2." },
      { id:"ar6", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"UN GROS PROBLÈME", sub:"Sustantivo masculino B2 (un ... majeur / actuel) :", ans:["enjeu","défi","un enjeu","un défi"], rule:"💡 <strong>un enjeu / un défi majeur :</strong> Sustituye de forma elegante y sobria a 'un gros problème'." },
      { id:"ar7", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"TRÈS BON / POSITIF", sub:"Adjetivo natural B2 (un impact ...) :", ans:["bénéfique","favorable","positif","avantageux"], rule:"💡 <strong>bénéfique / favorable :</strong> Adjetivo sobrio de B2 para defender ventajas en ensayos." },
      { id:"ar8", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"TRÈS MAUVAIS / NÉGATIF", sub:"Adjetivo natural B2 (un effet ...) :", ans:["néfaste","nuisible","négatif"], rule:"💡 <strong>néfaste / nuisible :</strong> Expresa consecuencias negativas sin caer en exageraciones." },
      { id:"ar9", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"TRÈS IMPORTANTE (fém.)", sub:"Adjetivo natural B2 al femenino :", ans:["essentielle","primordiale","indispensable"], rule:"💡 <strong>essentielle / primordiale :</strong> Ideal para valorar medidas y soluciones propuestas." },
      { id:"ar10", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"METTRE UNE NOUVELLE RÈGLE", sub:"Verbo natural B2 (adop... / instau... une règle) :", ans:["adopter","instaurer","mettre en place"], rule:"💡 <strong>adopter / instaurer une règle :</strong> Estilo institucional limpio para propuestas y recomendaciones." },
      { id:"ar11", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"AVOIR DES BONS EFFETS", sub:"Expresión natural B2 (avoir un ... positif) :", ans:["impact","un impact"], rule:"💡 <strong>avoir un impact positif :</strong> Mucho más profesional que 'avoir des bons effets'." },
      { id:"ar12", cat:"antirepetition", badge:"Vocab B2 (12+)", target:"EXPLIQUER ET ALERTER LES GENS", sub:"Verbo clave B2 de soluciones (sensi... le public) :", ans:["sensibiliser"], rule:"💡 <strong>sensibiliser le public :</strong> El verbo clásico de conclusión y propuestas ciudadanas en el TCF." }
    ];

    const STORAGE_KEY = 'tcf_ee_flash_v4';

    let state = {
      category: 'all',
      currentIndex: 0,
      score: 0,
      streak: 0,
      answered: false,
      errorIds: new Set(),
      activeDeck: []
    };

    function shuffle(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function loadErrors() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) state.errorIds = new Set(JSON.parse(raw));
      } catch (e) {
        state.errorIds = new Set();
      }
      document.getElementById('errCountBadge').textContent = state.errorIds.size;
    }

    function saveErrors() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(state.errorIds)));
      } catch (e) {}
      document.getElementById('errCountBadge').textContent = state.errorIds.size;
    }

    function onCategoryChange(cat) {
      state.category = cat;
      state.currentIndex = 0;
      document.getElementById('btnErrToggle').classList.remove('active');
      document.getElementById('categorySelect').value = cat;
      rebuildDeck();
      renderCard();
    }

    function toggleErrorMode() {
      if (state.category === 'errors') {
        onCategoryChange('all');
      } else {
        state.category = 'errors';
        state.currentIndex = 0;
        document.getElementById('btnErrToggle').classList.add('active');
        rebuildDeck();
        renderCard();
      }
    }

    function rebuildDeck() {
      let raw;
      if (state.category === 'errors') {
        raw = ITEMS.filter(it => state.errorIds.has(it.id));
      } else if (state.category === 'all') {
        raw = ITEMS;
      } else {
        raw = ITEMS.filter(it => it.cat === state.category);
      }
      state.activeDeck = shuffle(raw);
    }

    function renderCard() {
      const deck = state.activeDeck;
      const content = document.getElementById('activeContent');
      const empty = document.getElementById('emptyBox');
      const cardTop = document.getElementById('cardTop');
      const fb = document.getElementById('feedbackBox');

      fb.classList.remove('show', 'correct', 'wrong');
      document.getElementById('btnRemoveErr').style.display = 'none';

      if (!deck || deck.length === 0) {
        content.style.display = 'none';
        cardTop.style.display = 'none';
        empty.style.display = 'block';
        return;
      }

      content.style.display = 'block';
      cardTop.style.display = 'flex';
      empty.style.display = 'none';

      if (state.currentIndex >= deck.length) {
        state.currentIndex = 0;
      }

      const item = deck[state.currentIndex];
      state.answered = false;

      document.getElementById('badgeCat').textContent = item.badge;
      document.getElementById('counterProgress').textContent = (state.currentIndex + 1) + ' / ' + deck.length;
      document.getElementById('targetDisplay').textContent = item.target;
      document.getElementById('targetSub').textContent = item.sub;

      const inp = document.getElementById('answerInput');
      inp.value = '';
      inp.className = 'user-input';
      inp.disabled = false;
      inp.focus();
    }

    function onKey(e) {
      if (e.key === 'Enter') {
        if (state.answered) nextCard();
        else checkAnswer();
      }
    }

    function diagnose(userAns, target) {
      const u = userAns.trim().toLowerCase();
      const t = target.trim().toLowerCase();

      const uNoAcc = u.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const tNoAcc = t.normalize("NFD").replace(/[\u0300-\u036f]/g, "");

      if (uNoAcc === tNoAcc && u !== t) {
        return "⚠️ <strong>Falta de acentos:</strong> Escribiste <code>" + userAns + "</code> sin la tilde correcta. Forma exacta: <code>" + target + "</code>.";
      }
      if (t.endsWith('e') && !u.endsWith('e') && t.slice(0, -1) === u) {
        return "⚠️ <strong>Falta de GÉNERO:</strong> Olvidaste la <strong>'-e'</strong> final de femenino.";
      }
      if (t.endsWith('s') && !u.endsWith('s') && t.slice(0, -1) === u) {
        return "⚠️ <strong>Falta de PLURAL:</strong> Olvidaste la <strong>'-s'</strong> final de plural.";
      }
      if ((t === 'un' || t === 'le') && (u === 'une' || u === 'la')) {
        return "⚠️ <strong>Error de Género:</strong> Es una palabra <strong>MASCULINA</strong> en francés.";
      }
      if ((t === 'une' || t === 'la') && (u === 'un' || u === 'le')) {
        return "⚠️ <strong>Error de Género:</strong> Es una palabra <strong>FEMENINA</strong> en francés.";
      }
      return "⚠️ <strong>Forma no válida:</strong> Compara lo que escribiste con la respuesta oficial.";
    }

    function checkAnswer() {
      if (state.answered) return;
      const inp = document.getElementById('answerInput');
      const val = inp.value.trim();
      if (!val) return;

      state.answered = true;
      const deck = state.activeDeck;
      const item = deck[state.currentIndex];

      const norm = val.toLowerCase();
      const isOk = item.ans.some(a => a.toLowerCase() === norm);

      const fb = document.getElementById('feedbackBox');
      const fbStatus = document.getElementById('fbStatus');
      const fbDetail = document.getElementById('fbDetail');
      const fbRule = document.getElementById('fbRule');
      const btnRemove = document.getElementById('btnRemoveErr');

      fb.classList.remove('correct', 'wrong');

      if (isOk) {
        state.score++;
        state.streak++;
        fb.classList.add('correct', 'show');
        inp.classList.add('correct');
        inp.disabled = true;

        fbStatus.innerHTML = "✅ ¡Correcto!";
        fbDetail.innerHTML = "Escribiste exactamente: <strong style='color:#34d399;'>" + val + "</strong>";
        fbRule.innerHTML = item.rule;

        if (state.category === 'errors' || state.errorIds.has(item.id)) {
          btnRemove.style.display = 'inline-block';
        }
      } else {
        state.streak = 0;
        state.errorIds.add(item.id);
        saveErrors();

        fb.classList.add('wrong', 'show');
        inp.classList.add('wrong');
        inp.disabled = true;

        fbStatus.innerHTML = "❌ ¡Error guardado en tu Banco de Errores!";
        fbDetail.innerHTML = "Respuesta oficial: <strong style='color:#34d399;'>" + item.ans[0] + "</strong><br>" + diagnose(val, item.ans[0]);
        fbRule.innerHTML = item.rule;
      }

      document.getElementById('scoreVal').textContent = state.score;
      document.getElementById('streakVal').textContent = state.streak + ' 🔥';
    }

    function nextCard() {
      state.currentIndex++;
      renderCard();
    }

    function resolveCurrentError() {
      const deck = state.activeDeck;
      const item = deck[state.currentIndex];
      if (state.errorIds.has(item.id)) {
        state.errorIds.delete(item.id);
        saveErrors();
        rebuildDeck();
        renderCard();
      }
    }

    function addAccent(ch) {
      const inp = document.getElementById('answerInput');
      const start = inp.selectionStart || inp.value.length;
      const end = inp.selectionEnd || inp.value.length;
      inp.value = inp.value.substring(0, start) + ch + inp.value.substring(end);
      inp.focus();
      inp.selectionStart = inp.selectionEnd = start + 1;
    }

    window.onload = () => {
      loadErrors();
      onCategoryChange('all');
    };
  </script>
